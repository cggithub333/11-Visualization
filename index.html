<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Visualizer Hub · Serverless &amp; Voice Practice</title>
  <script src="./src/tailwind.js"></script>
  <link rel="stylesheet" href="./src/core/chassis.css">
  <link rel="stylesheet" href="./src/diagrams/runpod-serverless/styles.css">
  <link rel="stylesheet" href="./src/diagrams/lexis-voice/styles.css">
  <link rel="stylesheet" href="./src/diagrams/adaptive-context-switch/styles.css">
</head>
<body class="bg-[#090b0e] text-[#e6edf3] min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 antialiased font-sans select-none">

  <!-- Main Showcase Container (Machined Instrument Chassis) -->
  <main class="w-full max-w-[1360px] chassis-panel rounded-xl p-5 sm:p-7 relative overflow-hidden">
    
    <!-- Top Hub Navigation Bar & Diagram Switcher -->
    <header class="flex flex-wrap items-center justify-between gap-4 pb-4 mb-6 border-b border-[#1f2530]">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span class="text-xs uppercase tracking-wider font-semibold text-zinc-300">Architecture Visualizer Hub</span>
      </div>

      <!-- Diagram Selector Dropdown (Populated by DiagramRegistry) -->
      <div class="flex items-center gap-2">
        <label for="diagram-select" class="text-xs text-zinc-400 font-medium hidden sm:inline-block">Switch Diagram:</label>
        <div class="relative">
          <select id="diagram-select" class="appearance-none bg-[#141821] border border-[#252d3d] hover:border-blue-500/70 focus:border-blue-500 text-xs sm:text-sm font-medium text-[#d1d9e0] py-1.5 pl-3 pr-8 rounded-md shadow-sm transition-all cursor-pointer outline-none">
            <option value="runpod-serverless" hidden class="hidden" style="display:none">RunPod: Serverless GPU &amp; Auto-Scaling</option>
            <option value="lexis-voice" selected>1. Lexis: Voice Practice Architecture</option>
            <option value="adaptive-context-switch">2. Adaptive Context Switching &amp; Dynamic FSM</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
              <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
            </svg>
          </div>
        </div>
      </div>
    </header>

    <!-- Dynamic Mount Viewport for Registered Diagrams -->
    <div id="diagram-viewport" class="w-full relative"></div>

  </main>

  <!-- Core Infrastructure Modules -->
  <script src="./src/core/dom.js"></script>
  <script src="./src/core/registry.js"></script>

  <!-- Diagram 1: RunPod Serverless GPU Architecture -->
  <script src="./src/diagrams/runpod-serverless/template.js"></script>
  <script src="./src/diagrams/runpod-serverless/engine.js"></script>

  <!-- Diagram 2: Lexis Voice Practice & LLM Deep-Dive Architecture -->
  <script src="./src/diagrams/lexis-voice/template.js"></script>
  <script src="./src/diagrams/lexis-voice/llm-deep-dive.js"></script>
  <script src="./src/diagrams/lexis-voice/lexis-engine.js"></script>

  <!-- Diagram 3: Adaptive Context Switching & Dynamic FSM Pipeline -->
  <script src="./src/diagrams/adaptive-context-switch/template.js"></script>
  <script src="./src/diagrams/adaptive-context-switch/context-engine.js"></script>

  <!-- Core Lifecycle Switcher & URL Coordinator -->
  <script src="./src/core/switcher.js"></script>
</body>
</html>
